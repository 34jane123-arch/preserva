<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Buyer Dashboard | PRESERVA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="messages.css">
</head>
<body data-role="business">
  <div id="dashGate" class="auth-wrap" hidden>
    <div class="auth-card"><h2>Wrong dashboard</h2><p id="gateText"></p><a id="gateBtn" class="btn" href="login.html">Go to my dashboard</a></div>
  </div>
  <div class="dash" id="dashContent" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Business Buyer navigation">
      <div class="brand">PRESERVA</div>
      <button data-view="dashboard" class="on">📊 Dashboard</button>
      <button data-view="browse">🛒 Browse Products</button>
      <button data-view="cart">🧺 Shopping Cart <span class="pill warn" id="cartN" hidden>0</span></button>
      <button data-view="orders">📦 My Orders</button>
      <button data-view="msgs">💬 Messages <span class="pill warn" data-msg-badge hidden>0</span></button>
      <button data-view="profile">👤 My Profile</button>
      <div class="spacer"></div>
      <button id="logoutBtn">🚪 Logout</button>
    </aside>
    <div>
      <div class="dtop">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <h1 id="viewTitle">Dashboard</h1>
        <span class="chip-user"><b id="uName"></b> · Business Buyer</span>
      </div>
      <main class="dmain">
        <section class="view on" id="v-dashboard">
          <div class="stats" id="stats"></div>
          <div class="panel"><h2>Recently added products</h2><div class="pgrid" id="newGrid"></div></div>
          <div class="panel"><h2>Recent orders</h2><div id="recentOrders"></div></div>
        </section>
        <section class="view" id="v-browse">
          <div class="panel"><div class="fr">
            <input id="fSearch" type="search" placeholder="Search products" aria-label="Search products">
            <select id="fCat" aria-label="Category"><option value="">All categories</option><option>Fruits</option><option>Vegetables</option><option>Fish</option><option>Others</option></select>
            <select id="fFresh" aria-label="Freshness"><option value="">All freshness</option><option>Fresh</option><option>Not So Fresh</option><option>Unsold Yesterday</option><option>Damaged but Still Usable</option></select>
            <select id="fPrice" aria-label="Price"><option value="">Any price</option><option value="0-50">Under ₱50</option><option value="50-100">₱50 to ₱100</option><option value="100-">Over ₱100</option></select>
            <select id="fSort" aria-label="Sort"><option value="new">Newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div>
            <div class="pgrid" id="grid"></div></div>
        </section>
        <section class="view" id="v-cart"><div class="panel"><h2>Shopping cart</h2><div id="cartBox"></div></div></section>
        <section class="view" id="v-orders"><div class="panel"><h2>My orders</h2><div id="orderTable"></div></div></section>
        <section class="view" id="v-msgs"><div id="msgHost"></div></section>
        <section class="view" id="v-profile"><div class="panel"><h2>My profile</h2>
          <p>Name: <b id="pfName"></b></p><p>Username: <b id="pfUser"></b></p><p>Email: <b id="pfEmail"></b></p>
          <p>Account type: <b>Business Buyer</b></p><p>Member since: <b id="pfSince"></b></p>
          <p class="hint">Editing profile details needs a backend (future feature).</p></div></section>
      </main>
    </div>
  </div>
  <dialog id="dlg"><div id="dlgBody"></div><div class="row-actions" id="dlgBtns"></div></dialog>
  <div id="toast" role="status"></div>
  <script src="auth.js"></script>
  <script src="messages.js"></script>
  <script src="buyer.js"></script>
</body>
</html>
